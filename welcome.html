<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>خدمة التغطية</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<a href="locator.html" id="agence-btn">📍 أقرب وكالة</a>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:
    url('images (3).jpg') left center no-repeat,
    url('téléchargement2.jpg') right center no-repeat;
  background-size:25% 100%,25% 100%;
}

/* CONTAINER */
.container{
  max-width:950px;
  margin:25px auto;
  background:rgba(255,255,255,.95);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.2);
  position:relative;
}

/* LANGUAGE BUTTONS */
.lang-switch{
  text-align:center;
  margin-bottom:10px;
}
.lang-switch button{
  background:#3498db;
  color:white;
  border:none;
  padding:6px 12px;
  margin:0 5px;
  border-radius:20px;
  cursor:pointer;
  font-size:14px;
}
.lang-switch button:hover{
  background:#217dbb;
}

/* SLIDER */
.slider{
  position:relative;
  height:240px;
  overflow:hidden;
  border-radius:15px;
  margin-bottom:15px;
}
.slide{
  position:absolute;
  width:100%;
  height:100%;
  opacity:0;
  transition:opacity 1s;
}
.slide img{
  width:100%;
  height:100%;
  object-fit:contain;
  background-color:#fff;
  transform:scale(1.15);
}
.slide.active{ opacity:1; }

/* ARROWS */
.slider button.prev,
.slider button.next{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,0.45);
  color:white;
  border:none;
  width:40px;
  height:40px;
  border-radius:50%;
  cursor:pointer;
  font-size:26px;
  font-weight:bold;
}
.slider button.prev{ left:10px; }
.slider button.next{ right:10px; }

/* TEXT */
.welcome{
  text-align:center;
  color:#555;
  margin-bottom:20px;
  font-size:16px;
}

/* MAP */
.map-box{
  height:420px;
  border-radius:12px;
  overflow:hidden;
}
iframe{
  width:100%;
  height:100%;
  border:none;
}

/* INFO */
.info{
  margin-top:20px;
  padding:15px;
  border-left:6px solid #3498db;
  background:#f4f9ff;
  border-radius:10px;
}
#coverageMsg{
  font-size:15px;
  line-height:1.6;
}

/* TOOLTIP */
.tooltip{
  position:absolute;
  bottom:20px;
  right:30px;
  font-size:15px;
  cursor:pointer;
}
.tooltip span{
  visibility:hidden;
  background:#090907;
  color:#f4f4f4;
  padding:12px;
  border-radius:10px;
  width:600px;
  position:absolute;
  right:0;
  bottom:130%;
}
.tooltip:hover span{ visibility:visible; }

/* RETOUR */
.retour{
  position:fixed;
  bottom:20px;
  left:20px;
  background:#e74c3c;
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:50px;
  cursor:pointer;
}
#agence-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;          /* 👈 على اليمين */
  background: #00a6a6;
  color: #fff;
  padding: 14px 18px;
  border-radius: 30px;
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  z-index: 9999;
  transition: all 0.2s ease;
}

#agence-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 25px rgba(0,0,0,0.35);
}
</style>
</head>

<body>

<div class="container">

  <!-- LANGUAGE SWITCH -->
  <div class="lang-switch">
    <button onclick="setLanguage('ar')">🇹🇳 عربي</button>
    <button onclick="setLanguage('fr')">🇫🇷 Français</button>
    <button onclick="setLanguage('en')">🇬🇧 English</button>
  </div>

  <!-- SLIDER -->
  <div class="slider" id="slider">
    <div class="slide active"><img src="e1.png"></div>
    <div class="slide"><img src="WhatsApp Image 22.jpeg"></div>
    <div class="slide"><img src="WhatsApp Image 33.jpeg"></div>

    <button class="prev" onclick="prevSlide()">‹</button>
    <button class="next" onclick="nextSlide()">›</button>
  </div>

  <!-- TEXT -->
  <p class="welcome" id="welcomeText"></p>

  <!-- MAP -->
  <div class="map-box">
    <iframe src="https://geo.tunisietelecom.tn/mytaghtia/"></iframe>
  </div>

  <!-- INFO -->
  <div class="info">
    <p id="coverageMsg"></p>
  </div>

  <!-- TOOLTIP -->
  <div class="tooltip">❓
    <span id="tooltipText"></span>
  </div>

</div>

<button class="retour" onclick="window.location.href='index.html'">⬅️ Retour</button>

<script>
/* SLIDER */
let slides=document.querySelectorAll('.slide');
let i=0, sliderInterval;

function showSlide(index){
  slides.forEach(s=>s.classList.remove('active'));
  slides[index].classList.add('active');
}
function nextSlide(){ i=(i+1)%slides.length; showSlide(i); }
function prevSlide(){ i=(i-1+slides.length)%slides.length; showSlide(i); }
sliderInterval=setInterval(nextSlide,3000);

/* TRANSLATIONS */
const translations={
  ar:{
    welcome:"اختار الموقع من الخريطة و اطّلع على جودة التغطية المتوفرة في المكان.",
    coverage:"الرجاء اختيار موقع من الخريطة لعرض معلومات التغطية.",
    tooltip:"في إطار التكوين الجامعي في تطوير نظم المعلومات، تم إنجاز هذا المشروع خلال تربص بشركة اتصالات تونس، ويهدف إلى تمكين المستخدم من الاطلاع على جودة التغطية حسب موقعه الجغرافي."
  },
  fr:{
    welcome:"Choisissez votre position sur la carte et consultez la qualité de la couverture disponible.",
    coverage:"Veuillez sélectionner un emplacement sur la carte pour afficher les informations de couverture.",
    tooltip:"Dans le cadre de ma formation universitaire en Développement des Systèmes d’Information, ce projet a été réalisé lors d’un stage chez Tunisie Télécom afin de consulter la couverture réseau."
  },
  en:{
    welcome:"Select your location on the map and check the available network coverage.",
    coverage:"Please select a location on the map to view coverage information.",
    tooltip:"As part of my university training in Information Systems Development, this project was carried out during an internship at Tunisie Telecom to check network coverage by location."
  }
};

function setLanguage(lang){
  document.getElementById("welcomeText").innerText=translations[lang].welcome;
  document.getElementById("coverageMsg").innerText=translations[lang].coverage;
  document.getElementById("tooltipText").innerText=translations[lang].tooltip;
}

/* DEFAULT LANGUAGE */
setLanguage("ar");
</script>

</body>
</html>
